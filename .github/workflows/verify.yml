# Verification for the Zig package in this repository.
#
# Entirely this fork's file. curl's own CI is not copied here and could not be:
# it lives in curl's git repository, not in the release tarball this package was
# imported from, and it targets the maintainers' own infrastructure. Nothing
# below reaches a service, an account or a runner that is not the one GitHub
# provides for this repository.
#
# What it does and does not cover, stated up front rather than discovered later:
#
#   preflight  one fact, nothing else: is the package's single dependency -- the
#              sibling mbed-TLS package that `build.zig.zon` declares as a
#              relative path -- present in the checkout's parent directory?
#   source     the 418 recorded upstream digests and `tools/check-provenance.sh`.
#              Neither needs a compiler, so this job answers a real question
#              even while the sibling is missing.
#   native     does the whole 196-unit closure compile and link, do the tests
#              run in Debug and ReleaseSafe, does the example run, and does the
#              shared-object variant build
#   cross      does the package compile for each of the six compile-only targets
#              this workspace publishes, without running any of them
#   consumer   does the published module resolve from a package that did not
#              write it
#
# READ THIS BEFORE READING A RED RUN. The `mbed-tls/` sibling package this
# tree's TLS backend links is present on disk. Every job below except `source`
# and `preflight` is nonetheless PENDING-VERIFICATION: none of them has been run
# against this tree, so a red run here is a first result, not a known failure.
# There is no `continue-on-error` in this file, no `if:` that skips a step, and
# no matrix row that is allowed to fail -- because a tolerated failure is
# indistinguishable from a gate that was quietly dropped.
#
# What this file deliberately does not contain:
#
#   * The full 53-platform matrix. `cross-test`, run from the package root,
#     builds and *runs* `tests.zig` for every platform in Zig 0.16.0's published
#     Tier 1/2 table through this repository's own build graph, using
#     `cross-test.profile.sh` for its settings. It is not a job here because
#     `cross-test` and its sibling helpers are a host-local tool with its own
#     runner detection and its own scratch policy, not something a GitHub
#     runner has; adding a job that invoked a path it does not have would fail
#     for a reason that has nothing to do with this package, and wrapping that
#     job in an availability check would turn a missing gate into a green one.
#     So this file does not pretend to cover it and does not stand in for it:
#     the `cross` job below runs nothing, and a platform with no runner on the
#     host is recorded as explicit `build_only` coverage, never as a pass. The
#     command and its receipts belong in README.md and FORK-NOTES.md.
#   * A gate on the driver-approved host cache. AGENTS.md §6 names the compiler
#     this workspace builds with and the cache it lives in. CI installs its own
#     compiler through the setup action instead, because a host cache path from
#     this machine is not something a runner has and inventing one would be a
#     claim about a machine nobody here can check.
#   * System-library mode. There is no such mode in this package: `build.zig`
#     has no `-Dsystem` option, so there is nothing to gate and nothing to skip.
#   * Any assertion about what a target *refuses*. Another SDK in this workspace
#     asserts a documented refusal message for one target; that text is read out
#     of that package's own `build.zig`, and this owner did not read this
#     package's `build.zig`. So the `cross` steps below assert only that the
#     command runs, and whether `wasm32-wasi` compiles a C library with
#     `HAVE_THREADS_POSIX` unavailable is a driver observation that has not been
#     made yet. If it turns out to be refused, the honest edit is to replace
#     that step with an assertion on the specific documented message and to
#     record the run -- not to add a flag that hides it.
#
# SPDX-License-Identifier: curl

name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: sibling TLS dependency is present
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # One assertion about one file, and it fails loudly on purpose. Every
      # build job below needs the same thing and would otherwise fail with a
      # dependency error buried in a long compile log; this job names the cause
      # on its own so the rest of the red is legible.
      #
      # PENDING-VERIFICATION: `mbed-tls/` is not in this repository yet. This
      # step is red until the driver lands it.
      - name: the sibling mbed-TLS package is declared where the manifest expects it
        run: |
          set -euo pipefail
          manifest="../mbed-tls/build.zig.zon"
          if [ ! -f "$manifest" ]; then
            echo "::error::$manifest is not present."
            echo "build.zig.zon declares the package's only dependency as a relative" >&2
            echo "path to the mbed-TLS package. There is no vendored copy, no bridge and" >&2
            echo "no option that turns TLS off, so nothing else can satisfy it." >&2
            exit 1
          fi

  source:
    name: immutable upstream bytes, provenance and licence records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The bytes, and the exact upstream file set they belong to. `COPYING` has
      # no `LICENSE`-style sibling in curl's tree -- the grant *is* `COPYING` --
      # so a dropped attribution or a substituted licence text would be caught
      # here and nowhere else.
      #
      # PENDING-VERIFICATION: `tools/check-provenance.sh` is the provenance
      # owner's file and is not in the tree yet, so the second command fails
      # until it lands. The first does not need it and does not wait for it.
      - name: recorded digests and provenance
        run: |
          set -euo pipefail
          sha256sum -c UPSTREAM.sha256
          bash tools/check-provenance.sh

  native:
    name: native build, tests, example and both deliveries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Expected to fail on every step below until the sibling lands. See the
      # file header: the failure is the receipt, and nothing here is allowed to
      # turn it into a pass.
      - name: build (static, the default linkage)
        run: zig build --summary all

      # The default step installs, so this is where the delivery tree appears:
      # the library, the public headers, the pkg-config file and the licence
      # records, all written by the build graph. Checking the layout here would
      # restate a path list in a second place; the paths are the build owner's
      # to define and the driver's to verify, so this step builds and stops.
      - name: test (static, Debug)
        run: zig build test

      - name: test (static, ReleaseSafe)
        run: zig build test -Doptimize=ReleaseSafe

      - name: smoke (static)
        run: zig build smoke

      # The second delivery is a variant of the same source list, not a second
      # build system: `-Dlinkage` selects which artifact is delivered and
      # installed, and never changes what is compiled.
      - name: build (shared object)
        run: zig build -Dlinkage=dynamic --summary all

  cross:
    name: cross-target compile matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # Six separate steps, six separate targets, no tolerated failure and no
      # matrix row. Each one compiles the whole package for that target and
      # runs nothing: a successful foreign compile is `build_only` coverage, not
      # a passing Zig API test. A matrix row allowed to fail is
      # indistinguishable from a target that was quietly dropped, so each target
      # gets its own step and its own result.
      #
      # The six are this workspace's published compile-only set. None of them
      # asserts that the target is *supported*: it asserts that the command runs
      # and lets the answer be what it is.
      - name: check x86_64-linux-gnu
        run: zig build check -Dtarget=x86_64-linux-gnu --summary all

      - name: check aarch64-linux-gnu
        run: zig build check -Dtarget=aarch64-linux-gnu --summary all

      - name: check aarch64-macos-none
        run: zig build check -Dtarget=aarch64-macos-none --summary all

      - name: check x86_64-windows-gnu
        run: zig build check -Dtarget=x86_64-windows-gnu --summary all

      - name: check riscv64-linux-gnu
        run: zig build check -Dtarget=riscv64-linux-gnu --summary all

      # The sixth of the published set. It is not asserted to succeed and not
      # asserted to fail: this package's `build.zig` was not read by this owner,
      # so no refusal message is claimed for it here. What this step will
      # actually report first is the same missing sibling every other step
      # reports.
      - name: check wasm32-wasi
        run: zig build check -Dtarget=wasm32-wasi --summary all

  consumer:
    name: consumer package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The failure this catches is the one the library's own tests cannot see:
      # a module that builds from the inside and does not resolve from outside.
      # The consumer reaches this package through the relative path dependency in
      # its own manifest, and the module it names is the same one the published
      # route is.
      - name: run (static, the default linkage)
        working-directory: consumer
        run: zig build run

      - name: run against the shared object
        working-directory: consumer
        run: zig build run -Dlinkage=dynamic